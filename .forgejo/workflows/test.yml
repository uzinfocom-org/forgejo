name: Test CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test-flake:
    name: "Test flake"
    runs-on: native

    steps:
      - name: Clone the repository
        # uses: actions/checkout@v6
        uses: actions/checkout@v7


      - name: Check up flake configuration
        run: nix flake check --show-trace

  build-and-project:
    name: "Build and test"
    runs-on: native

    steps:
      - name: Clone the repository
        uses: actions/checkout@v7

      - name: Build and test project
        run: nix run .\#e2etest

      # - name: Build
        # run: cabal test